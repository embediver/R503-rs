[package]
name = "r503"
version = "0.1.0"
edition = "2024"
description = "A library for the Grow R503 fingerprint reader."
repository = "https://github.com/embediver/R503-rs"
categories = ["embedded", "no-std", "asynchronous", "hardware-support"]
keywords = ["embedded-hal-driver", "async", "fingerprint", "uart"]
license.workspace = true

[dependencies]
embedded-io-async.workspace = true
defmt = "1.1"
zerocopy = {version = "0.8.48", features = ["derive"]}

[dev-dependencies]
embedded-io-async = { version = "0.7.0", features = ["std"] }
smol = "2.0.2"
defmt2log = "0.2.0"
flexi_logger = "0.31.8"
